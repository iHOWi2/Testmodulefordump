name: Build Zygisk module

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          local-cache: true

      - name: Fetch ShadowHook and ImGui
        run: |
          mkdir -p module/jni/external
          git clone --depth 1 https://github.com/bytedance/android-inline-hook.git module/jni/external/shadowhook_src
          git clone --depth 1 https://github.com/ocornut/imgui.git module/jni/external/imgui

      - name: Build all ABIs
        working-directory: module/jni
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S . -B build/$ABI -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$ABI -j
          done

      - name: Assemble module zip
        run: |
          STAGE=dist/stage
          mkdir -p $STAGE/zygisk
          cp -r module/template/* $STAGE/
          for ABI in arm64-v8a armeabi-v7a; do
            cp module/jni/build/$ABI/libil2cppdumper.so $STAGE/zygisk/$ABI.so
          done
          cd $STAGE && zip -r ../zygisk_il2cpp_dumper.zip . && cd -

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk_il2cpp_dumper
          path: dist/zygisk_il2cpp_dumper.zip
